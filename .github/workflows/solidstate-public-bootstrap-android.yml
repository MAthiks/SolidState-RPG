name: SolidState Android PUBLIC bootstrap debug
on:
  push:
    branches:
      - android-public-bootstrap-v1
    paths:
      - android_public_loader/SS_Public_Bootstrap_BuildPayload.b64
      - .github/workflows/solidstate-public-bootstrap-android.yml
permissions:
  contents: read
jobs:
  build-public-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Extraire les sources publiques et valider la provenance
        run: |
          mkdir -p public_build
          base64 -d android_public_loader/SS_Public_Bootstrap_BuildPayload.b64 > /tmp/solidstate-public-source.tar.gz
          echo "585adf0f75c25dd0c78b34c5abee62bd092f2c49d9f6d920d66c71d35556f50a  /tmp/solidstate-public-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/solidstate-public-source.tar.gz -C public_build
          python public_build/scripts/audit_public_shell.py
          python -m unittest discover -s public_build/tests -p 'test_*.py' -v
      - name: Compiler l'application publique sans données Gardien
        working-directory: public_build/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Auditor le fichier APK final
        run: python public_build/scripts/audit_public_shell.py public_build/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SolidState_Android_Public_Bootstrap_Debug_v1
          path: public_build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
