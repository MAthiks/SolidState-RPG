name: DEV R1 CoC7 Registry Batch2

on:
  push:
    branches: [dev/r1-coc7-registry-batch2]
    paths:
      - development/r1-coc7-registry-batch1/**
      - development/r1-coc7-registry-batch2/**
      - .github/workflows/dev-r1-coc7-registry-batch2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-registry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile Batch1 and Batch2 only
        run: |
          python -m compileall -q development/r1-coc7-registry-batch1
          python -m compileall -q development/r1-coc7-registry-batch2

      - name: Re-run Batch1 targeted tests
        working-directory: development/r1-coc7-registry-batch1
        run: python -m unittest discover -v -p 'test_*_dev.py'

      - name: Run Batch2 targeted matrix
        working-directory: development/r1-coc7-registry-batch2
        run: python -m unittest discover -v -p 'test_*_dev.py'

      - name: Confirm lineage and non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('development/r1-coc7-registry-batch2/occupations_batch2.json').read_text())
          assert d['status'] == 'DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert d['parent_registry_id'] == 'COC7_RECOVERY_REGISTRY_R1_BATCH1_DEV_V1'
          assert d['frozen_ancestor_registry_id'] == 'COC7_RECOVERY_REGISTRY_R1_C4_V1'
          assert d['authority_promoted'] is False
          assert len(d['occupations']) == 23
          PY

      - name: Confirm no private rulebook PDF is tracked in DEV batch
        run: |
          set -euo pipefail
          if git ls-files development/r1-coc7-registry-batch2 | grep -Ei '\.pdf$'; then
            echo 'Private rulebook PDF tracked in Batch2' >&2
            exit 1
          fi

      - name: Summary
        run: |
          echo '## CoC7 Registry Batch2 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Batch1 regression check: **YES**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Batch2 occupations: **23**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cumulative occupations: **34**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen C4 registry mutated: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Private PDFs tracked: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
