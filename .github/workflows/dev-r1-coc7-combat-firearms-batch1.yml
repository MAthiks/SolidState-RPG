name: DEV R1 CoC7 Combat Firearms Batch1

on:
  push:
    branches: ["dev/r1-coc7-combat-firearms-batch1"]
    paths:
      - "development/r1-coc7-combat-firearms-batch1/**"
      - ".github/workflows/dev-r1-coc7-combat-firearms-batch1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-combat-firearms-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile targeted modules
        run: |
          python -m compileall -q recovery/recertification-r1/rules_r1
          python -m compileall -q development/r1-coc7-equipment-weapons-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch1
      - name: Re-run frozen Rules Core tests
        working-directory: recovery/recertification-r1
        run: python -m rules_r1.test_core_rules
      - name: Re-run equipment weapon parent matrix
        working-directory: development/r1-coc7-equipment-weapons-batch1
        run: python -m unittest -v test_eqwp_batch1_dev.py
      - name: Run combat firearms targeted matrix
        working-directory: development/r1-coc7-combat-firearms-batch1
        run: python -m unittest -v test_combat_firearms_dev.py
      - name: Confirm scope and non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('development/r1-coc7-combat-firearms-batch1')
          c=json.loads((base/'combat_firearms_contract.json').read_text())
          r=json.loads((base/'DEV_COMBAT_FIREARMS_BATCH1_REPORT.json').read_text())
          assert c['status']==r['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['parent_registry_id']==r['parent_registry_id']=='COC7_RECOVERY_EQUIPMENT_WEAPONS_R1_BATCH1_DEV_V1'
          assert c['frozen_rules_package_id']==r['frozen_rules_package_id']=='COC7_RECOVERY_RULE_PACKAGE_R1_CORE_V1'
          assert c['authority_promoted'] is r['authority_promoted'] is False
          assert c['checkpoint_created'] is r['checkpoint_created'] is False
          assert 'FULL_AUTO' in c['explicitly_blocked_batch1']
          PY
      - name: Confirm no private PDFs tracked
        run: |
          if git ls-files development/r1-coc7-combat-firearms-batch1 | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in combat module' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Combat / Firearms Batch1 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen Rules Core regression: **PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Equipment/Weapons parent: **173 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combat/Firearms: **55 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full auto: **FAIL-CLOSED / NOT MATERIALIZED**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Randomness generated by module: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
