name: DEV R1 CoC7 Ranged Thrown Armor Batch1 Hardened

on:
  push:
    branches: ["dev/r1-coc7-ranged-thrown-armor-batch1"]
    paths:
      - "development/r1-coc7-ranged-thrown-armor-batch1/**"
      - ".github/workflows/dev-r1-coc7-ranged-thrown-armor-batch1-hardened.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-reproducibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile new batch
        run: python -m compileall -q development/r1-coc7-ranged-thrown-armor-batch1
      - name: Run exact hardened 1608-test gate
        run: python development/r1-coc7-ranged-thrown-armor-batch1/run_hardened_gate.py
      - name: Summary
        run: |
          echo '## Ranged / Thrown / Armor Batch1 hardened gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent chain: **1528/1528 required**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Targeted matrix: **80/80 required**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combined: **1608/1608 required**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Contract + DEV report: **verified**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ambiguous opposed range fusion: **FAIL CLOSED**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Private PDFs tracked: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
