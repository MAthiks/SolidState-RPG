name: DEV R1 CoC7 Magic Core Batch1

on:
  push:
    branches: ["dev/r1-coc7-magic-core-batch1"]
    paths:
      - "development/r1-coc7-magic-core-batch1/**"
      - ".github/workflows/dev-r1-coc7-magic-core-batch1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-magic-core-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile targeted modules
        run: |
          python -m compileall -q recovery/recertification-r1/rules_r1
          python -m compileall -q development/r1-coc7-equipment-weapons-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch2
          python -m compileall -q development/r1-coc7-melee-combat-batch1
          python -m compileall -q development/r1-coc7-wounds-healing-batch1
          python -m compileall -q development/r1-coc7-sanity-insanity-batch1
          python -m compileall -q development/r1-coc7-sanity-treatment-batch2
          python -m compileall -q development/r1-coc7-chase-batch1
          python -m compileall -q development/r1-coc7-chase-batch2
          python -m compileall -q development/r1-coc7-magic-core-batch1
      - name: Re-run frozen Rules Core tests
        working-directory: recovery/recertification-r1
        run: python -m rules_r1.test_core_rules
      - name: Re-run Equipment Weapons regression
        working-directory: development/r1-coc7-equipment-weapons-batch1
        run: python -m unittest -v test_eqwp_batch1_dev.py
      - name: Re-run Combat Firearms Batch1 regression
        working-directory: development/r1-coc7-combat-firearms-batch1
        run: python -m unittest -v test_combat_firearms_dev.py
      - name: Re-run Combat Firearms Batch2 regression
        working-directory: development/r1-coc7-combat-firearms-batch2
        run: python -m unittest -v test_combat_firearms_batch2_dev.py
      - name: Re-run Melee Combat Batch1 regression
        working-directory: development/r1-coc7-melee-combat-batch1
        run: python -m unittest -v test_melee_combat_dev.py
      - name: Re-run Wounds Healing Batch1 regression
        working-directory: development/r1-coc7-wounds-healing-batch1
        run: python -m unittest -v test_wounds_healing_dev.py
      - name: Re-run Sanity Insanity Batch1 regression
        working-directory: development/r1-coc7-sanity-insanity-batch1
        run: python -m unittest -v test_sanity_insanity_dev.py
      - name: Re-run Sanity Treatment Batch2 regression
        working-directory: development/r1-coc7-sanity-treatment-batch2
        run: python -m unittest -v test_sanity_treatment_dev.py
      - name: Re-run Chase Batch1 regression
        working-directory: development/r1-coc7-chase-batch1
        run: python -m unittest -v test_chase_dev.py
      - name: Re-run Chase Batch2 regression
        working-directory: development/r1-coc7-chase-batch2
        run: python -m unittest -v test_chase_batch2_dev.py
      - name: Run Magic Core Batch1 targeted matrix
        working-directory: development/r1-coc7-magic-core-batch1
        run: python -m unittest -v test_magic_core_dev.py
      - name: Confirm validated report and non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('development/r1-coc7-magic-core-batch1')
          c=json.loads((base/'magic_core_batch1_contract.json').read_text())
          r=json.loads((base/'DEV_MAGIC_CORE_BATCH1_REPORT.json').read_text())
          assert c['status']==r['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['module_id']==r['module_id']=='COC7_MAGIC_CORE_R1_BATCH1_DEV_V1'
          assert c['parent_chase_module_id']==r['parent_chase_module_id']=='COC7_CHASE_R1_BATCH2_DEV_V1'
          assert c['source']['sha256']==r['keeper_source_sha256']=='691cd2fe986a235a42b30646811210d442954801e068fc11cece869d928bd779'
          assert r['targeted_tests_expected']==96
          assert r['validated_chain_total_expected']==912
          assert r['validation']['workflow_run_id']==33303671660
          assert r['validation']['result']=='PASS'
          assert r['validation']['parent_chain_tests']==816
          assert r['validation']['targeted_tests']==96
          assert r['validation']['chain_total']==912
          assert c['authority_promoted'] is r['authority_promoted'] is False
          assert c['checkpoint_created'] is r['checkpoint_created'] is False
          assert c['private_pdf_embedded'] is r['private_pdf_embedded'] is False
          assert r['randomness_generated'] is False
          assert 'SPELL_SPECIFIC_EFFECTS' in c['explicitly_blocked_batch1']
          PY
      - name: Confirm no private PDFs tracked
        run: |
          if git ls-files development/r1-coc7-magic-core-batch1 | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in Magic Core Batch1' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Magic Core Batch1 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Prior validated chain: **816 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Magic Core targeted matrix: **96 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Validated chain total: **912 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Random values generated by module: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Spell-specific effects copied: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Private PDFs tracked: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
