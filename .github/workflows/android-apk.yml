name: Build Android APK Checkpoint 330
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [dev329-android-apk-wrapper]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK shell
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: APK shell metadata
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          sha256sum "$APK" | tee apk-shell-sha256.txt
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SolidState-Offline-Checkpoint330-unsigned-apk-shell
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/apk-shell-sha256.txt
          if-no-files-found: error
