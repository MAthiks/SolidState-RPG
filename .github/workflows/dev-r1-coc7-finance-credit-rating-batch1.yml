name: DEV R1 CoC7 Finance Credit Rating Batch1

on:
  push:
    branches: ["dev/r1-coc7-finance-credit-rating-batch1"]
    paths:
      - "development/r1-coc7-finance-credit-rating-batch1/**"
      - ".github/workflows/dev-r1-coc7-finance-credit-rating-batch1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-finance-credit-rating-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile validated chain and Finance Batch1
        run: |
          python -m compileall -q recovery/recertification-r1/rules_r1
          python -m compileall -q development/r1-coc7-equipment-weapons-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch2
          python -m compileall -q development/r1-coc7-melee-combat-batch1
          python -m compileall -q development/r1-coc7-wounds-healing-batch1
          python -m compileall -q development/r1-coc7-sanity-insanity-batch1
          python -m compileall -q development/r1-coc7-sanity-treatment-batch2
          python -m compileall -q development/r1-coc7-chase-batch1
          python -m compileall -q development/r1-coc7-chase-batch2
          python -m compileall -q development/r1-coc7-magic-core-batch1
          python -m compileall -q development/r1-coc7-magic-core-batch2
          python -m compileall -q development/r1-coc7-investigator-development-batch1
          python -m compileall -q development/r1-coc7-investigator-aging-batch2
          python -m compileall -q development/r1-coc7-finance-credit-rating-batch1
      - name: Re-run frozen Rules Core tests
        working-directory: recovery/recertification-r1
        run: python -m rules_r1.test_core_rules
      - name: Re-run Equipment Weapons regression
        working-directory: development/r1-coc7-equipment-weapons-batch1
        run: python -m unittest -v test_eqwp_batch1_dev.py
      - name: Re-run Combat Firearms Batch1 regression
        working-directory: development/r1-coc7-combat-firearms-batch1
        run: python -m unittest -v test_combat_firearms_dev.py
      - name: Re-run Combat Firearms Batch2 regression
        working-directory: development/r1-coc7-combat-firearms-batch2
        run: python -m unittest -v test_combat_firearms_batch2_dev.py
      - name: Re-run Melee Combat Batch1 regression
        working-directory: development/r1-coc7-melee-combat-batch1
        run: python -m unittest -v test_melee_combat_dev.py
      - name: Re-run Wounds Healing Batch1 regression
        working-directory: development/r1-coc7-wounds-healing-batch1
        run: python -m unittest -v test_wounds_healing_dev.py
      - name: Re-run Sanity Insanity Batch1 regression
        working-directory: development/r1-coc7-sanity-insanity-batch1
        run: python -m unittest -v test_sanity_insanity_dev.py
      - name: Re-run Sanity Treatment Batch2 regression
        working-directory: development/r1-coc7-sanity-treatment-batch2
        run: python -m unittest -v test_sanity_treatment_dev.py
      - name: Re-run Chase Batch1 regression
        working-directory: development/r1-coc7-chase-batch1
        run: python -m unittest -v test_chase_dev.py
      - name: Re-run Chase Batch2 regression
        working-directory: development/r1-coc7-chase-batch2
        run: python -m unittest -v test_chase_batch2_dev.py
      - name: Re-run Magic Core Batch1 regression
        working-directory: development/r1-coc7-magic-core-batch1
        run: python -m unittest -v test_magic_core_dev.py
      - name: Re-run Magic Core Batch2 regression
        working-directory: development/r1-coc7-magic-core-batch2
        run: python -m unittest -v test_magic_core_batch2_dev.py
      - name: Re-run Investigator Development Batch1 regression
        working-directory: development/r1-coc7-investigator-development-batch1
        run: python -m unittest -v test_investigator_development_dev.py
      - name: Re-run Investigator Aging Batch2 regression
        working-directory: development/r1-coc7-investigator-aging-batch2
        run: python -m unittest -v test_investigator_aging_dev.py
      - name: Run Finance Credit Rating Batch1 targeted matrix
        working-directory: development/r1-coc7-finance-credit-rating-batch1
        run: python -m unittest -v test_finance_credit_rating_dev.py
      - name: Confirm exact Finance test count
        run: |
          python - <<'PY'
          import sys, unittest
          from pathlib import Path
          p=Path('development/r1-coc7-finance-credit-rating-batch1').resolve()
          sys.path.insert(0, str(p))
          suite=unittest.defaultTestLoader.discover(str(p), pattern='test_finance_credit_rating_dev.py')
          assert suite.countTestCases()==99, suite.countTestCases()
          PY
      - name: Confirm validated report, source policy and non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('development/r1-coc7-finance-credit-rating-batch1')
          c=json.loads((base/'finance_credit_rating_batch1_contract.json').read_text())
          r=json.loads((base/'FINANCE_CREDIT_RATING_BATCH1_DEV_REPORT.json').read_text())
          assert c['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['module_id']=='COC7_FINANCE_CREDIT_RATING_R1_BATCH1_DEV_V1'
          assert c['parent_aging_module_id']=='COC7_INVESTIGATOR_AGING_R1_BATCH2_DEV_V1'
          assert c['source']['sha256']=='691cd2fe986a235a42b30646811210d442954801e068fc11cece869d928bd779'
          assert c['public_table_policy']['cash_asset_brackets_embedded'] is False
          assert c['public_table_policy']['cash_refresh_values_embedded'] is False
          assert c['public_table_policy']['spending_level_values_embedded'] is False
          assert c['public_table_policy']['adapter_must_supply_exact_verified_values'] is True
          assert c['private_pdf_embedded'] is False
          assert c['authority_promoted'] is False
          assert c['checkpoint_created'] is False
          assert r['result']=='PASS'
          assert r['source_commit_tested']=='7ed50338fde863e425a9e0ad090db47d0bd1635b'
          assert r['github_actions_run_id']==33306078960
          assert r['targeted_tests']=={'passed':99,'total':99}
          assert r['prior_validated_chain']=={'passed':1173,'total':1173}
          assert r['combined_chain']=={'passed':1272,'total':1272}
          assert r['public_cash_assets_table_values_embedded'] is False
          assert r['public_cash_refresh_values_embedded'] is False
          assert r['public_spending_level_values_embedded'] is False
          assert r['private_adapter_required_for_exact_finance_profile'] is True
          assert r['automatic_asset_conversion'] is False
          assert r['automatic_asset_conversion_duration'] is False
          assert r['automatic_debt_terms'] is False
          assert r['automatic_credit_rating_change_without_gate'] is False
          assert r['insufficient_cash_partial_mutation'] is False
          assert r['random_values_generated_by_module'] is False
          assert r['private_pdf_embedded'] is False
          assert r['authority_promoted'] is False
          assert r['checkpoint_created'] is False
          assert r['status']=='DEV_VALIDATED_NOT_AUTHORITY'
          PY
      - name: Confirm no private PDFs tracked
        run: |
          if git ls-files development/r1-coc7-finance-credit-rating-batch1 | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in Finance Credit Rating Batch1' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Finance Credit Rating Batch1 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Prior validated chain: **1173/1173 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Finance Credit Rating Batch1 targeted matrix: **99/99 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combined chain: **1272/1272 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Commercial Cash & Assets table embedded: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automatic asset conversion/debt terms: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Random values generated by module: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Private PDFs tracked: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
