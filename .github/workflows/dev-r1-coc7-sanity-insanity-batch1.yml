name: DEV R1 CoC7 Sanity Insanity Batch1

on:
  push:
    branches: ["dev/r1-coc7-sanity-insanity-batch1"]
    paths:
      - "development/r1-coc7-sanity-insanity-batch1/**"
      - ".github/workflows/dev-r1-coc7-sanity-insanity-batch1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-sanity-insanity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile targeted modules
        run: |
          python -m compileall -q recovery/recertification-r1/rules_r1
          python -m compileall -q development/r1-coc7-equipment-weapons-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch2
          python -m compileall -q development/r1-coc7-melee-combat-batch1
          python -m compileall -q development/r1-coc7-wounds-healing-batch1
          python -m compileall -q development/r1-coc7-sanity-insanity-batch1
      - name: Re-run frozen Rules Core tests
        working-directory: recovery/recertification-r1
        run: python -m rules_r1.test_core_rules
      - name: Re-run Equipment Weapons regression
        working-directory: development/r1-coc7-equipment-weapons-batch1
        run: python -m unittest -v test_eqwp_batch1_dev.py
      - name: Re-run Combat Firearms Batch1 regression
        working-directory: development/r1-coc7-combat-firearms-batch1
        run: python -m unittest -v test_combat_firearms_dev.py
      - name: Re-run Combat Firearms Batch2 regression
        working-directory: development/r1-coc7-combat-firearms-batch2
        run: python -m unittest -v test_combat_firearms_batch2_dev.py
      - name: Re-run Melee Combat Batch1 regression
        working-directory: development/r1-coc7-melee-combat-batch1
        run: python -m unittest -v test_melee_combat_dev.py
      - name: Re-run Wounds Healing Batch1 regression
        working-directory: development/r1-coc7-wounds-healing-batch1
        run: python -m unittest -v test_wounds_healing_dev.py
      - name: Run Sanity Insanity Batch1 targeted matrix
        working-directory: development/r1-coc7-sanity-insanity-batch1
        run: python -m unittest -v test_sanity_insanity_dev.py
      - name: Confirm scope and non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('development/r1-coc7-sanity-insanity-batch1')
          c=json.loads((base/'sanity_insanity_contract.json').read_text())
          r=json.loads((base/'DEV_SANITY_INSANITY_BATCH1_REPORT.json').read_text())
          assert c['status']==r['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['module_id']==r['module_id']=='COC7_SANITY_INSANITY_R1_BATCH1_DEV_V1'
          assert c['parent_wounds_module_id']==r['parent_wounds_module_id']=='COC7_WOUNDS_HEALING_R1_BATCH1_DEV_V1'
          assert c['frozen_rules_package_id']==r['frozen_rules_package_id']=='COC7_RECOVERY_RULE_PACKAGE_R1_CORE_V1'
          assert c['source']['sha256']==r['keeper_source_sha256']=='691cd2fe986a235a42b30646811210d442954801e068fc11cece869d928bd779'
          assert r['targeted_tests_expected']==80
          assert r['validated_chain_total_expected']==587
          assert c['authority_promoted'] is r['authority_promoted'] is False
          assert c['checkpoint_created'] is r['checkpoint_created'] is False
          assert c['randomness_policy'].startswith('No random values generated')
          PY
      - name: Confirm no private PDFs tracked
        run: |
          if git ls-files development/r1-coc7-sanity-insanity-batch1 | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in sanity module' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Sanity / Insanity Batch1 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen Rules Core: **37 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Equipment/Weapons: **173 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combat Firearms Batch1: **55 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combat Firearms Batch2: **79 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Melee Combat Batch1: **65 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Wounds/Healing Batch1: **98 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Sanity/Insanity Batch1: **80 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chain total: **587 PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automatic madness/phobia/mania selection: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Randomness generated by module: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
