name: DEV R1 CoC7 Investigator Creation Batch3

on:
  push:
    branches: [dev/r1-coc7-investigator-creation-batch3]
    paths:
      - development/r1-coc7-investigator-creation-batch3/**
      - development/r1-coc7-investigator-creation-batch2/**
      - development/r1-coc7-finance-credit-rating-batch1/**
      - development/r1-coc7-equipment-weapons-batch1/**
      - recovery/recertification-r1/runtime_r1/**
      - .github/workflows/dev-r1-coc7-investigator-creation-batch3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-investigator-creation-batch3-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile parent and Batch3 integration tree
        run: |
          python -m compileall -q development/r1-coc7-investigator-creation-batch2
          python -m compileall -q development/r1-coc7-investigator-creation-batch3
          python -m compileall -q development/r1-coc7-finance-credit-rating-batch1
          python -m compileall -q development/r1-coc7-equipment-weapons-batch1
          python -m compileall -q recovery/recertification-r1/runtime_r1
      - name: Re-run hardened creation Batch2 — exact 2514
        run: |
          out="$(python development/r1-coc7-investigator-creation-batch2/run_hardened_gate.py)"
          printf '%s\n' "$out"
          grep -F '"combined_tests": 2514' <<<"$out"
          grep -F '"result": "PASS"' <<<"$out"
      - name: Run Investigator Creation Batch3 targeted matrix — exact 100
        working-directory: development/r1-coc7-investigator-creation-batch3
        run: |
          set +e
          out="$(python -m unittest -v test_investigator_creation_batch3_dev.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -F 'Ran 100 tests' <<<"$out"
          grep -F 'OK' <<<"$out"
      - name: Confirm exact test-chain arithmetic
        run: |
          python - <<'PY'
          assert 2514 + 100 == 2614
          print('2614/2614 candidate arithmetic confirmed')
          PY
      - name: Confirm integration identities and non-authority invariants
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          d=Path('development/r1-coc7-investigator-creation-batch3')
          sys.path.insert(0,str(d))
          import investigator_creation_batch3_dev as m
          c=json.loads((d/'investigator_creation_batch3_contract.json').read_text())
          assert c['schema']=='COC7_INVESTIGATOR_CREATION_BATCH3_CONTRACT_V1'
          assert c['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['module_id']==m.MODULE_ID=='COC7_INVESTIGATOR_CREATION_R1_BATCH3_DEV_V1'
          assert c['parent_validated_commit']=='a76d6d176209c110b25069a6e359b77d11422ed5'
          assert c['parent_validated_proof']==m.PARENT_HARDENED_PROOF==2514
          assert m.FINANCE_MODULE_ID=='COC7_FINANCE_CREDIT_RATING_R1_BATCH1_DEV_V1'
          assert m.EQUIPMENT_WEAPON_REGISTRY_ID=='COC7_RECOVERY_EQUIPMENT_WEAPONS_R1_BATCH1_DEV_V1'
          assert c['automatic_equipment_selection'] is False
          assert c['automatic_weapon_selection'] is False
          assert c['automatic_asset_conversion'] is False
          assert c['automatic_debt_creation'] is False
          assert c['random_values_generated_by_module'] is False
          assert c['private_cash_assets_table_embedded'] is False
          assert c['private_pdf_embedded'] is False
          assert c['authority_promoted'] is False
          assert c['checkpoint_created'] is False
          PY
      - name: Confirm no private PDFs tracked
        run: |
          set -euo pipefail
          if git ls-files development/r1-coc7-investigator-creation-batch3 | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in investigator creation batch3' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Investigator Creation Batch3 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent hardened creation proof: **2514 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Batch3 targeted tests: **100 expected**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combined candidate proof: **2614 tests**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Atomic actor-bound creation commit: **under test**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Auto possession: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Commercial finance table embedded: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
