name: Recovery Recertification R1-C4

on:
  push:
    branches:
      - recovery/recertification-r1
    paths:
      - recovery/recertification-r1/**
      - .github/workflows/recovery-recertification-r1-c4.yml
  pull_request:
    branches:
      - main
    paths:
      - recovery/recertification-r1/**
      - .github/workflows/recovery-recertification-r1-c4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4-registry-canonical-router-gate:
    runs-on: ubuntu-latest
    env:
      C4_SOURCE_COMMIT: 9d84e463db86f73e388315470ad8272f54f5677d
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconfirm Checkpoint333 provenance floor
        run: python recovery/recertification-r1/run_public_gate_r1.py

      - name: Rebuild frozen R1-C1 rules dependency
        env:
          R1_C1_OUTDIR: ${{ runner.temp }}/r1c4_rules
          RECOVERY_SOURCE_COMMIT: af1d1a0113e2181c9e827f0d111273be180ca670
        run: |
          set -euo pipefail
          python recovery/recertification-r1/build_rules_package_r1.py
          RULES="${R1_C1_OUTDIR}/CoC7_Recovery_Rules_R1_Core.zip"
          test "$(sha256sum "$RULES" | awk '{print $1}')" = "c18ad9763b44eb0d2864bc61ab01aa709eda604f4318af8498e6759df8f4b8c2"
          mkdir -p recovery/recertification-r1/rules
          cp "$RULES" recovery/recertification-r1/rules/CoC7_Recovery_Rules_R1_Core.zip

      - name: Rebuild exact frozen R1-C2 and R1-C3 parents
        env:
          R1_C2_OUTDIR: ${{ runner.temp }}/r1c2_frozen
          RECOVERY_SOURCE_COMMIT_C2: 12f680f52a8a027ce38617d003355aaebcbcc269
          R1_C3_OUTDIR: ${{ runner.temp }}/r1c3_frozen
          RECOVERY_SOURCE_COMMIT_C3: 00eabb605d74ff9ff0bebcd49c29658fde888da5
        run: |
          set -euo pipefail
          python recovery/recertification-r1/build_integrated_runtime_r1_c2.py
          C2_ZIP="${R1_C2_OUTDIR}/SolidState_Recovery_Runtime_R1_C2.zip"
          C2_SHA="$(sha256sum "$C2_ZIP" | awk '{print $1}')"
          test "$C2_SHA" = "20cc854247ea6427e4c31ee6572a9d312d1178ac89d31dd0856128ddaa0f55ba"
          export R1_C2_FROZEN_ZIP="$C2_ZIP"
          python recovery/recertification-r1/build_integrated_runtime_r1_c3.py
          C3_SHA="$(sha256sum "${R1_C3_OUTDIR}/SolidState_Recovery_Runtime_R1_C3.zip" | awk '{print $1}')"
          test "$C3_SHA" = "553b95b761dc0426d4d163fb137988287574a56c913447a297b192874b6a98df"
          echo "FROZEN_R1_C2_SHA256=$C2_SHA"
          echo "FROZEN_R1_C3_SHA256=$C3_SHA"

      - name: Run R1-C4 public registry and router tests
        working-directory: recovery/recertification-r1
        run: python test_registry_router_public_r1_c4.py

      - name: Verify sanitized private C4 evidence
        run: |
          jq -e '.result == "PASS" and .passed == 222 and .total == 222 and .source_identities == "8/8 PASS" and .authority_promoted == false and .private_source_content_embedded == false and .c3_mapping_correction.id == "C3-MAP-001" and .c3_mapping_correction.automatic_substitution == false' recovery/recertification-r1/R1_C4_PRIVATE_ROUTER_REPORT.json

      - name: First frozen deterministic R1-C4 build
        env:
          R1_C4_OUTDIR: ${{ runner.temp }}/r1c4_first
          RECOVERY_SOURCE_COMMIT_C4: ${{ env.C4_SOURCE_COMMIT }}
        run: |
          python recovery/recertification-r1/build_integrated_runtime_r1_c4.py
          sha256sum "${R1_C4_OUTDIR}/SolidState_Recovery_Runtime_R1_C4.zip" | tee "${RUNNER_TEMP}/r1c4_first.sha256"

      - name: Second frozen deterministic R1-C4 build
        env:
          R1_C4_OUTDIR: ${{ github.workspace }}/recovery/recertification-r1/c4_dist
          RECOVERY_SOURCE_COMMIT_C4: ${{ env.C4_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          python recovery/recertification-r1/build_integrated_runtime_r1_c4.py
          FIRST_SHA="$(awk '{print $1}' "${RUNNER_TEMP}/r1c4_first.sha256")"
          SECOND_SHA="$(sha256sum "${R1_C4_OUTDIR}/SolidState_Recovery_Runtime_R1_C4.zip" | awk '{print $1}')"
          test "$FIRST_SHA" = "$SECOND_SHA"
          test "$SECOND_SHA" = "e719a9295e088e48c23eec0d698d046045dd8f6dfa0e5713aa05cd53b114cb1b"
          jq -e '.source_commit == "9d84e463db86f73e388315470ad8272f54f5677d"' "${R1_C4_OUTDIR}/R1_C4_BUILD_REPORT.json"
          jq -e '.parent_r1_c3_sha256 == "553b95b761dc0426d4d163fb137988287574a56c913447a297b192874b6a98df"' "${R1_C4_OUTDIR}/R1_C4_BUILD_REPORT.json"
          jq -e '.embedded_rules_sha256 == "c18ad9763b44eb0d2864bc61ab01aa709eda604f4318af8498e6759df8f4b8c2"' "${R1_C4_OUTDIR}/R1_C4_BUILD_REPORT.json"
          jq -e '.public_tests == "45/45 PASS" and .private_matrix == "222/222 PASS" and .private_sources_embedded == false and .authority_promoted == false' "${R1_C4_OUTDIR}/R1_C4_BUILD_REPORT.json"
          test "$SECOND_SHA" != "75cd524d80b376f35d7db04e2c3d7833524cbf3fa4f1cc3f19beaad58e569add"
          echo "FROZEN_R1_C4_SHA256=$SECOND_SHA"

      - name: Verify extracted frozen R1-C4 package and rerun public tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/r1c4_extract"
          mkdir -p "${RUNNER_TEMP}/r1c4_extract"
          unzip -q recovery/recertification-r1/c4_dist/SolidState_Recovery_Runtime_R1_C4.zip -d "${RUNNER_TEMP}/r1c4_extract"
          cd "${RUNNER_TEMP}/r1c4_extract/SolidState_Recovery_Runtime_R1_C4"
          python verify_package.py
          export R1_C1_RULES_ZIP="$PWD/rules/CoC7_Recovery_Rules_R1_Core.zip"
          PYTHONPATH=. python test_registry_router_public_r1_c4.py

      - name: Upload frozen R1-C4 candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovery-recertification-r1-c4-runtime
          path: |
            recovery/recertification-r1/c4_dist/SolidState_Recovery_Runtime_R1_C4.zip
            recovery/recertification-r1/c4_dist/R1_C4_BUILD_REPORT.json
            recovery/recertification-r1/R1_C4_PRIVATE_ROUTER_REPORT.json
          if-no-files-found: error
          retention-days: 30

      - name: Write R1-C4 summary
        shell: bash
        run: |
          SHA="$(jq -r '.zip_sha256' recovery/recertification-r1/c4_dist/R1_C4_BUILD_REPORT.json)"
          echo '## Recovery Recertification R1-C4' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Checkpoint333 documentary floor: **PRESERVED**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen R1-C2 parent: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen R1-C3 parent: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen R1-C1 Rules: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Public registry/router tests: **45/45 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Private canonical router matrix: **222/222 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- C3-MAP-001 Maison du Pendu substitution correction: **PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical routes ready: **BRUME / ANTRE / MUSE / EXPLORATEUR**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Soleil Noir v1.5: **SOURCE READY / PATH BLOCKED**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Maison du Pendu: **SOURCE IDENTITY BLOCKED**' >> "$GITHUB_STEP_SUMMARY"
          echo "- Frozen C4 SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Next gate: `R1-C4B_EXPAND_REGISTRIES_AND_COMPILE_REMAINING_SCENARIO_ROUTES`' >> "$GITHUB_STEP_SUMMARY"
