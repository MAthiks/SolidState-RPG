name: DEV R1 CoC7 Canonical Runtime Creation Binding

on:
  push:
    branches: [dev/r1-coc7-canonical-runtime-creation-binding]
    paths:
      - development/r1-coc7-canonical-runtime-creation-binding/**
      - development/r1-coc7-investigator-creation-batch4/**
      - development/r1-coc7-investigator-creation-batch3/**
      - recovery/recertification-r1/**
      - .github/workflows/dev-r1-coc7-canonical-runtime-creation-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-canonical-runtime-creation-binding-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile binding integration tree
        run: |
          python -m compileall -q development/r1-coc7-canonical-runtime-creation-binding
          python -m compileall -q development/r1-coc7-investigator-creation-batch4
          python -m compileall -q recovery/recertification-r1
      - name: Re-run hardened creation Batch4 — exact 2714
        run: |
          out="$(python development/r1-coc7-investigator-creation-batch4/run_hardened_gate.py)"
          printf '%s\n' "$out"
          grep -F '"combined_tests": 2714' <<<"$out"
          grep -F '"result": "PASS"' <<<"$out"
      - name: Run canonical runtime creation binding matrix — exact 100
        working-directory: development/r1-coc7-canonical-runtime-creation-binding
        run: |
          set +e
          out="$(python -m unittest -v test_canonical_runtime_creation_binding_dev.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -F 'Ran 100 tests' <<<"$out"
          grep -F 'OK' <<<"$out"
      - name: Confirm exact test-chain arithmetic
        run: |
          python - <<'PY'
          assert 2714 + 100 == 2814
          print('2814/2814 candidate arithmetic confirmed')
          PY
      - name: Confirm contract and non-authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('development/r1-coc7-canonical-runtime-creation-binding/canonical_runtime_creation_binding_contract.json').read_text())
          assert c['schema']=='COC7_CANONICAL_RUNTIME_CREATION_BINDING_CONTRACT_V1'
          assert c['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['module_id']=='COC7_CANONICAL_RUNTIME_CREATION_BINDING_R1_DEV_V1'
          assert c['parent_creation_module_id']=='COC7_INVESTIGATOR_CREATION_R1_BATCH4_DEV_V1'
          assert c['parent_validated_commit']=='3dc2b82b5a1ea2bb4f0e76694f3d8e8f26990154'
          assert c['parent_validated_proof']==2714
          assert c['frozen_runtime_integration_id']=='SOLIDSTATE_RECOVERY_RUNTIME_R1_C4_V1'
          assert c['checkpoint_floor']==333
          assert c['automatic_scenario_binding'] is False
          assert c['automatic_investigator_completion'] is False
          assert c['private_pdf_embedded'] is False
          assert c['authority_promoted'] is False
          assert c['checkpoint_created'] is False
          PY
      - name: Confirm no private PDFs tracked
        run: |
          set -euo pipefail
          if git ls-files development/r1-coc7-canonical-runtime-creation-binding | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in canonical creation binding' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Canonical Runtime Creation Binding DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent hardened creation proof: **2714 PASS**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Binding targeted tests: **100 expected**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combined candidate proof: **2814 tests**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen runtime integration: **C4**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Public source-file preflight replacement: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
