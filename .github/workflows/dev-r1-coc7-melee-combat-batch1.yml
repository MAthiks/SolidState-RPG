name: DEV R1 CoC7 Melee Combat Batch1

on:
  push:
    branches: ["dev/r1-coc7-melee-combat-batch1"]
    paths:
      - "development/r1-coc7-melee-combat-batch1/**"
      - ".github/workflows/dev-r1-coc7-melee-combat-batch1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-melee-combat-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile targeted modules
        run: |
          python -m compileall -q recovery/recertification-r1/rules_r1
          python -m compileall -q development/r1-coc7-equipment-weapons-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch1
          python -m compileall -q development/r1-coc7-combat-firearms-batch2
          python -m compileall -q development/r1-coc7-melee-combat-batch1
      - name: Re-run frozen Rules Core tests
        working-directory: recovery/recertification-r1
        run: python -m rules_r1.test_core_rules
      - name: Re-run Equipment Weapons regression
        working-directory: development/r1-coc7-equipment-weapons-batch1
        run: python -m unittest -v test_eqwp_batch1_dev.py
      - name: Re-run Combat Firearms Batch1 regression
        working-directory: development/r1-coc7-combat-firearms-batch1
        run: python -m unittest -v test_combat_firearms_dev.py
      - name: Re-run Combat Firearms Batch2 regression
        working-directory: development/r1-coc7-combat-firearms-batch2
        run: python -m unittest -v test_combat_firearms_batch2_dev.py
      - name: Run Melee Combat Batch1 targeted matrix
        working-directory: development/r1-coc7-melee-combat-batch1
        run: python -m unittest -v test_melee_combat_dev.py
      - name: Confirm scope and non-authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('development/r1-coc7-melee-combat-batch1')
          c=json.loads((base/'melee_combat_contract.json').read_text())
          r=json.loads((base/'DEV_MELEE_COMBAT_BATCH1_REPORT.json').read_text())
          assert c['status']==r['status']=='DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert c['module_id']==r['module_id']=='COC7_MELEE_COMBAT_R1_BATCH1_DEV_V1'
          assert c['parent_firearms_module_id']==r['parent_firearms_module_id']=='COC7_COMBAT_FIREARMS_R1_BATCH2_DEV_V1'
          assert c['parent_registry_id']==r['parent_registry_id']=='COC7_RECOVERY_EQUIPMENT_WEAPONS_R1_BATCH1_DEV_V1'
          assert c['authority_promoted'] is r['authority_promoted'] is False
          assert c['checkpoint_created'] is r['checkpoint_created'] is False
          assert r['randomness_generated'] is False
          assert c['materialized_rules']['pushed_combat_rolls'] is False
          PY
      - name: Confirm no private PDFs tracked
        run: |
          if git ls-files development/r1-coc7-melee-combat-batch1 | grep -Ei '\.pdf$'; then
            echo 'Private PDF tracked in melee combat module' >&2
            exit 1
          fi
      - name: Summary
        run: |
          echo '## Melee Combat Batch1 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen Rules Core: **37 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Equipment/Weapons: **173 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combat Firearms Batch1: **55 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Combat Firearms Batch2: **79 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Melee Combat Batch1: **65 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Targeted combat chain total: **409 tests PASS if green**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Dodge / Fight Back / Maneuvers / Surprise / Outnumbered: **MATERIALIZED DEV**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Randomness generated by module: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
