name: DEV R1 C4B2 LSNT v1.5

on:
  push:
    branches:
      - dev/r1-c4b2-lsnt-v1.5-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-route-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile C4B2 modules
        run: |
          python -m py_compile \
            recovery/recertification-r1/registry_r1_c4b2_lsnt.py \
            recovery/recertification-r1/scenario_router_r1_c4b2_lsnt.py \
            recovery/recertification-r1/integrated_adjudication_r1_c4b2_lsnt.py \
            recovery/recertification-r1/test_lsnt_router_public_r1_c4b2.py \
            development/r1-c4b2-lsnt-v1.5-current/canonical_runtime_creation_binding_c4b2_lsnt.py \
            development/r1-c4b2-lsnt-v1.5-current/test_canonical_runtime_creation_binding_c4b2_lsnt.py
      - name: Run public LSNT v1.5 route and registry gate
        working-directory: recovery/recertification-r1
        run: python test_lsnt_router_public_r1_c4b2.py
      - name: Run public canonical creation binding gate
        working-directory: development/r1-c4b2-lsnt-v1.5-current
        run: python -m unittest -v test_canonical_runtime_creation_binding_c4b2_lsnt.py
      - name: Build exact public code bundle
        run: |
          tar -czf c4b2-public-code.tgz \
            development/r1-c4b2-lsnt-v1.5-current \
            development/r1-coc7-investigator-creation-batch1 \
            development/r1-coc7-investigator-creation-batch2 \
            development/r1-coc7-investigator-creation-batch3 \
            development/r1-coc7-investigator-creation-batch4 \
            development/r1-coc7-registry-batch1 \
            development/r1-coc7-registry-batch2 \
            development/r1-coc7-registry-batch3 \
            development/r1-coc7-registry-batch4 \
            development/r1-coc7-registry-batch5 \
            development/r1-coc7-finance-credit-rating-batch1 \
            development/r1-coc7-equipment-weapons-batch1 \
            recovery/recertification-r1
          sha256sum c4b2-public-code.tgz > c4b2-public-code.tgz.sha256
      - name: Upload exact public code bundle
        uses: actions/upload-artifact@v4
        with:
          name: c4b2-public-code-${{ github.sha }}
          path: |
            c4b2-public-code.tgz
            c4b2-public-code.tgz.sha256
          if-no-files-found: error
          retention-days: 1
