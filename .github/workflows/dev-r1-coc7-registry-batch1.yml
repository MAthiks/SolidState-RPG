name: DEV R1 CoC7 Registry Batch1

on:
  push:
    branches: [dev/r1-coc7-registry-batch1]
    paths:
      - development/r1-coc7-registry-batch1/**
      - .github/workflows/dev-r1-coc7-registry-batch1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-registry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Batch1 only
        run: python -m compileall -q development/r1-coc7-registry-batch1
      - name: Run targeted Batch1 tests
        working-directory: development/r1-coc7-registry-batch1
        run: python -m unittest discover -v -p 'test_*_dev.py'
      - name: Confirm non-authoritative DEV scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('development/r1-coc7-registry-batch1/occupations_batch1.json').read_text())
          assert d['status'] == 'DEV_SOURCE_GROUNDED_NOT_FROZEN'
          assert d['authority_promoted'] is False
          assert d['parent_registry_id'] == 'COC7_RECOVERY_REGISTRY_R1_C4_V1'
          PY
      - name: Summary
        run: |
          echo '## CoC7 Registry Batch1 DEV gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Targeted tests only: **YES**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen C4 registry mutated: **NO**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authority promoted: **NO**' >> "$GITHUB_STEP_SUMMARY"
