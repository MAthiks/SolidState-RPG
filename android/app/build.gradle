plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.solidstate.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.solidstate.offline'
        minSdk 24
        targetSdk 35
        versionCode 333
        versionName '0.2.0-cp333-rc1'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
    }
}
